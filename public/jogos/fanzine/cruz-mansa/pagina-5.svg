<text x="60" y="170" font-family="'Courier New', Courier, monospace" font-size="16" fill="#1c1c1a">Gente, esta é a última página do nº 7</text>
<text x="60" y="191" font-family="'Courier New', Courier, monospace" font-size="16" fill="#1c1c1a">e a gente precisa contar uma coisa.</text>
<g transform="rotate(-2 300 360)"><rect x="62" y="230" width="476" height="190" fill="#f4f2ec" stroke="#1c1c1a" stroke-width="2"/>
<text x="80" y="268" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="20" fill="#1c1c1a">A Papelaria Sol Nascente vai fechar</text>
<text x="80" y="298" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="20" fill="#1c1c1a">em abril. Era lá que a gente xerocava</text>
<text x="80" y="328" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="20" fill="#1c1c1a">tudo, a preço de amigo. Sem a máquina,</text>
<text x="80" y="358" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="20" fill="#1c1c1a">sem a zine. O jeito é guardar bem</text>
<text x="80" y="388" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="20" fill="#1c1c1a">estas folhas.</text>
</g>
<rect x="80" y="300" width="330" height="26" fill="#dd5d05" fill-opacity=".5" rx="3"/>
<rect x="240" y="214" width="110" height="28" fill="#e8dc9a" fill-opacity=".6" stroke="#b8ac6a" stroke-opacity=".5" transform="rotate(4 295 228)"/>
<text x="60" y="500" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1c1c1a">Obrigada a quem leu, copiou, passou adiante.</text>
<text x="60" y="521" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1c1c1a">Se um dia a gente se achar de novo, a</text>
<text x="60" y="542" font-family="'Courier New', Courier, monospace" font-size="15" fill="#1c1c1a">primeira rodada de xerox é por nossa conta.</text>
<text x="60" y="640" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="28" fill="#1c1c1a">★ ★ ★</text>
